<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10242b">
  <title>动物小镇英语探险</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- 开始入口 -->
  <section class="start-card" id="start-card">
    <div class="start-badge" aria-hidden="true">3D</div>
    <h1>动物小镇英语探险</h1>
    <p>小兔要办一场派对。带上它跑遍小镇，听懂英语、大胆开口，把事情一件一件办成。</p>
    <button type="button" class="big-btn" id="start-btn">进入小镇</button>
    <p class="start-note">建议打开声音，手机可横屏体验更好</p>
  </section>

  <!-- 主舞台 -->
  <section class="stage" id="stage" hidden>
    <header class="hud-top">
      <button type="button" class="hud-btn" id="back-btn" hidden>回小镇地图</button>
      <div class="hud-title" id="hud-title">动物小镇</div>
      <button type="button" class="hud-btn bag" id="bag-btn">背包 <span id="bag-count">0</span></button>
    </header>

    <!-- 3D 画布挂载点 -->
    <div class="canvas-wrap" id="canvas-wrap"></div>

    <!-- 进度（关卡内显示） -->
    <div class="progress" id="progress" hidden></div>

    <!-- 对话行 -->
    <div class="speaker-row" id="speaker-row" hidden>
      <div class="avatar avatar--beaver" aria-hidden="true"></div>
      <div class="speaker-meta">
        <span id="speaker-name">河狸馆员</span>
        <p class="en-line" id="en-line" hidden></p>
      </div>
    </div>

    <!-- 控制条 -->
    <div class="control-bar" id="control-bar" hidden>
      <button type="button" class="ctrl" id="replay-btn"><span class="horn" aria-hidden="true"></span>再听一次</button>
      <button type="button" class="ctrl ghost" id="caption-btn">看字幕</button>
      <button type="button" class="ctrl ghost" id="demo-btn">看示范</button>
    </div>

    <p class="tip" id="tip" role="status"></p>

    <!-- 示范弹层 -->
    <div class="modal" id="demo-modal" hidden>
      <div class="modal-box">
        <h2>看馆员怎么做</h2>
        <div class="demo-stage" id="demo-stage"></div>
        <button type="button" class="big-btn" id="demo-close">我看懂了，换一题</button>
      </div>
    </div>

    <!-- 开口环节 -->
    <div class="modal" id="speak-modal" hidden>
      <div class="modal-box">
        <h2>对馆员说一句</h2>
        <p class="speak-en" lang="en-US">Can I check this out, please?</p>
        <div class="speak-actions">
          <button type="button" class="ctrl" id="speak-listen"><span class="horn" aria-hidden="true"></span>听范音</button>
          <button type="button" class="big-btn" id="speak-done">我来说 / 直接借书</button>
        </div>
        <button type="button" class="skip-link" id="speak-skip">先不说，跳过</button>
      </div>
    </div>

    <!-- 完成 -->
    <div class="modal" id="done-modal" hidden>
      <div class="modal-box">
        <h2>书借到啦</h2>
        <div class="report" id="report"></div>
        <button type="button" class="big-btn" id="done-continue">回小镇，继续探险</button>
      </div>
    </div>
  </section>

  <audio id="voice" preload="auto"></audio>

  <script type="module" src="js/main.js"></script>
</body>
</html>

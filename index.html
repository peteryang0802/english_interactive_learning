<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#122a2f">
  <title>动物小镇 · 第一关：书在哪儿</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles.css">
  <script defer src="app.js"></script>
</head>
<body>
  <header class="masthead">
    <div class="brand"><strong>动物小镇 · 第一关</strong></div>
    <span class="language" lang="en-US">EN-US</span>
  </header>

  <main class="wrap">
    <!-- 开始入口 -->
    <section class="start-card" id="start-card">
      <h1>帮小兔找到书</h1>
      <p>戴上小耳朵，听河狸馆员说，再点你听到的那本书。</p>
      <button type="button" class="big-btn" id="start-btn">开始探险</button>
    </section>

    <!-- 主流程 -->
    <section class="stage-card" id="stage-card" hidden>
      <div class="progress" id="progress" aria-label="闯关进度"></div>

      <div class="speaker-row">
        <div class="avatar avatar--beaver" id="avatar" aria-hidden="true"></div>
        <div class="speaker-meta">
          <span id="speaker-name">河狸馆员</span>
          <p class="en-line" id="en-line" hidden></p>
        </div>
      </div>

      <!-- 场景：可点的书 -->
      <div class="scene" id="scene">
        <div class="surface" id="surface">
          <!-- 两本书由 JS 渲染 -->
        </div>
      </div>

      <!-- 控制条：重听 + 字幕求助，始终和书同屏 -->
      <div class="control-bar">
        <button type="button" class="ctrl" id="replay-btn">
          <span class="horn" aria-hidden="true"></span>再听一次
        </button>
        <button type="button" class="ctrl ghost" id="caption-btn">看字幕</button>
        <button type="button" class="ctrl ghost" id="demo-btn">看示范</button>
      </div>

      <p class="tip" id="tip" role="status"></p>

      <!-- 示范弹层 -->
      <div class="modal" id="demo-modal" hidden>
        <div class="modal-box">
          <h2>看馆员怎么做</h2>
          <div class="demo-stage" id="demo-stage"></div>
          <button type="button" class="big-btn" id="demo-close">我看懂了，换一题</button>
        </div>
      </div>

      <!-- 开口环节 -->
      <div class="modal" id="speak-modal" hidden>
        <div class="modal-box">
          <h2>对馆员说一句</h2>
          <p class="speak-en" lang="en-US">Can I check this out, please?</p>
          <div class="speak-actions">
            <button type="button" class="ctrl" id="speak-listen"><span class="horn" aria-hidden="true"></span>听范音</button>
            <button type="button" class="big-btn" id="speak-done">我来说 / 直接借书</button>
          </div>
          <button type="button" class="skip-link" id="speak-skip">先不说，跳过</button>
        </div>
      </div>

      <!-- 完成 -->
      <div class="modal" id="done-modal" hidden>
        <div class="modal-box">
          <h2>书借到啦</h2>
          <div class="report" id="report"></div>
          <button type="button" class="big-btn" id="again-btn">再玩一次</button>
        </div>
      </div>
    </section>
  </main>

  <audio id="voice" preload="auto"></audio>
</body>
</html>
